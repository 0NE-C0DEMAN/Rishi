# Streamlit host configuration.
# The rich UI is rendered by an embedded React app; this theme only styles
# the login gate and the page chrome behind the embed.

[server]
headless = true
port = 8501
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#121826"
textColor = "#e6edf3"
font = "sans serif"
