# Streamlit host configuration.
# The rich UI is an embedded React app; this theme only styles the login gate
# and the sidebar data-source panel behind the embed. Kept in step with the
# dashboard's premium light design tokens (ui/dashboard.src.html).

[server]
headless = true
port = 8501
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2D5BFF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FB"
textColor = "#0E1733"
font = "sans serif"
