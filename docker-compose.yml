services:
  governance-console:
    build: .
    container_name: governance-console
    ports:
      - "8501:8501"
    environment:
      # Override with `APP_PASSWORD=yourpass docker-compose up` for a real password.
      - APP_PASSWORD=${APP_PASSWORD:-demo123}
      # Optional: enables the live Gemma AI narrative (falls back to the local
      # model when unset).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
