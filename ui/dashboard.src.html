<script>
/* Horizontal scrolling for wide tables. Enables a horizontal wheel (deltaX),
   Shift + wheel, and a plain vertical wheel when the hovered container can ONLY
   scroll sideways; at either edge the event passes through so the page still
   scrolls. Non-passive, and preventDefault only when we actually scrolled. */
document.addEventListener('wheel', function (e) {
  var el = e.target;
  while (el && el.nodeType === 1 && el !== document.body) {
    if (el.scrollWidth > el.clientWidth + 1) {
      var ox = getComputedStyle(el).overflowX;
      if (ox === 'auto' || ox === 'scroll') break;
    }
    el = el.parentElement;
  }
  if (!el || el.nodeType !== 1 || el === document.body || el.scrollWidth <= el.clientWidth + 1) return;
  var oy = getComputedStyle(el).overflowY;
  var scrollsVert = (oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1;
  var dx = 0;
  if (e.deltaX !== 0) dx = e.deltaX;
  else if (e.shiftKey && e.deltaY !== 0) dx = e.deltaY;
  else if (!scrollsVert && e.deltaY !== 0) dx = e.deltaY;
  if (!dx) return;
  if (e.deltaMode === 1) dx *= 16; else if (e.deltaMode === 2) dx *= el.clientWidth;
  var max = el.scrollWidth - el.clientWidth;
  var next = Math.max(0, Math.min(max, el.scrollLeft + dx));
  if (next !== el.scrollLeft) { el.scrollLeft = next; e.preventDefault(); }
}, { passive: false });
</script>

function tint(hex, alpha) {

}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

function fmtInt(v) { return v == null || v === '' || isNaN(Number(v)) ? '—' : String(Math.round(Number(v))); }
function fmtMoney(v, precise) {
  if (v == null || isNaN(Number(v))) return '—';
  const n = Number(v), a = Math.abs(n), sign = n < 0 ? '-' : '';
  if (precise) return sign + '$' + a.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (a >= 1e6) return sign + '$' + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return sign + '$' + Math.round(a / 1e3) + 'k';
  return sign + '$' + a.toFixed(0);
}
function fmtHours(v) { return v == null || isNaN(Number(v)) ? '—' : Math.round(Number(v)).toLocaleString() + 'h'; }

/* Post structured data back to the Streamlit host through its hidden JSON
   uploader — the only channel a component has for sending data to the server. */
function hostSendJSON(obj) {
  const d = hostDoc();
  if (!d) return 'Host not reachable.';
  const input = d.querySelector('.st-key-host_edits input[type="file"]');
  if (!input) return 'Host edit channel not found.';
  const body = JSON.stringify(Object.assign({ token: String(Date.now()) + Math.random().toString(36).slice(2) }, obj));
  const file = new File([body], 'edits.json', { type: 'application/json' });
  const dt = new DataTransfer();
  dt.items.add(file);
  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'files').set;
  setter.call(input, dt.files);
  input.dispatchEvent(new Event('change', { bubbles: true }));
  return null;
}

/* Modal — scrim, scale-from-0.96 entrance, Escape to close, focus trapped to panel */
function Modal({ title, onClose, children, width = 'min(1100px, calc(100vw - 48px))' }) {
  const panel = useRef(null);

    const onKey = e => {

      if (e.key === 'Tab' && panel.current) {
        const f = panel.current.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');

        const first = f[0], last = f[f.length - 1];

        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }

    if (panel.current) panel.current.focus();
    return () => document.removeEventListener('keydown', onKey);

          animation: 'modalIn .18s cubic-bezier(.22,1,.36,1)' }}>

          <button onClick={onClose} title="Close (Esc)" aria-label="Close"
            style={{ background: 'var(--surface-2)', border: 'none', color: 'var(--text-2)', cursor: 'pointer',

          </button>
        </div>

      </div>

  );

}

function Pill({ text, color = '#6B7280', style }) {

function SearchBox({ value, onChange, placeholder = 'Search…', width = 240 }) {

function Banner({ tone = 'info', children, style }) {

/* ------------------------------------------------------------------ *
 *  DataTable — frozen left columns, sorting, zebra, pagination        *
 * ------------------------------------------------------------------ */
const STICKY_MASK = 40;

function PgBtn({ label, active, disabled, onClick }) {
  return (
    <button onClick={disabled ? undefined : onClick} disabled={disabled}
      style={{ minWidth: 28, height: 28, padding: '0 7px', borderRadius: 7, border: '1px solid',
        borderColor: active ? 'var(--accent)' : 'var(--border)', background: active ? 'var(--accent)' : 'var(--surface)',
        color: active ? '#fff' : disabled ? 'var(--text-3)' : 'var(--text-2)', fontSize: 12, fontWeight: 600,
        fontFamily: 'var(--font)', cursor: disabled ? 'default' : 'pointer', opacity: disabled ? 0.5 : 1, transition: 'all .12s' }}>{label}</button>
  );
}

function DataTable({ columns, rows, initialSort, initialDir = 'asc', pinLeft = 0, pageSize = 12, zebra = true, dense, empty, onRowClick, fit }) {
  const [sortKey, setSortKey] = useState(initialSort || null);
  const [dir, setDir] = useState(initialDir);
  const [scrolled, setScrolled] = useState(false);
  const [page, setPage] = useState(0);
  const [rowH, setRowH] = useState(0);
  const scRef = useRef(null);
  const bodyRef = useRef(null);

  useEffect(() => {
    const el = scRef.current; if (!el) return;
    let raf = 0;
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => setScrolled(el.scrollLeft > 0)); };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => { el.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, []);

  const sorted = useMemo(() => {
    if (!sortKey) return rows;
    const col = columns.find(c => c.key === sortKey);
    const arr = [...rows];
    arr.sort((a, b) => {
      let x = col && col.sortVal ? col.sortVal(a) : a[sortKey];
      let y = col && col.sortVal ? col.sortVal(b) : b[sortKey];
      const nx = Number(x), ny = Number(y);
      const numeric = !isNaN(nx) && !isNaN(ny) && x !== '' && x != null && y !== '' && y != null;
      const r = numeric ? nx - ny : String(x == null ? '' : x).localeCompare(String(y == null ? '' : y));
      return dir === 'asc' ? r : -r;
    });
    return arr;
  }, [rows, sortKey, dir, columns]);

  // Measure a real row so filler rows match exactly and the card never jumps.
  useEffect(() => {
    const el = bodyRef.current;
    if (!el) return;
    const first = el.querySelector('tr:not([aria-hidden])');
    if (first) {
      const h = Math.round(first.getBoundingClientRect().height);
      if (h && h !== rowH) setRowH(h);
    }
  });

  // fit: derive how many rows actually fit the space the table was given, so a
  // page fills the viewport exactly and pagination is the only control.
  const [autoSize, setAutoSize] = useState(0);
  useEffect(() => {
    if (!fit) return;
    const el = scRef.current && scRef.current.parentElement;
    if (!el || !window.ResizeObserver) return;
    const calc = () => {
      const avail = el.clientHeight - 34 /* header */ - 45 /* pagination */;
      const per = rowH || 38;
      const n = Math.max(4, Math.floor(avail / per));
      setAutoSize(n);
    };
    calc();
    const ro = new ResizeObserver(calc);
    ro.observe(el);
    return () => ro.disconnect();
  }, [fit, rowH]);

  const size = fit && autoSize ? autoSize : pageSize;
  const nPages = Math.max(1, Math.ceil(sorted.length / size));
  useEffect(() => { if (page > nPages - 1) setPage(0); }, [nPages, page]);
  const pageRows = sorted.slice(page * size, page * size + size);
  const paginated = sorted.length > size;

  const handleSort = (c) => {
    if (c.sortable === false) return;
    if (sortKey === c.key) setDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(c.key); setDir(c.defaultDesc ? 'desc' : 'asc'); }
    setPage(0);
  };

  // exact cumulative left offsets for frozen columns (tableLayout:fixed keeps them true)
  const lefts = []; let acc = 0;
  columns.forEach((c, i) => { lefts[i] = acc; if (i < pinLeft) acc += (c.width || 120); });
  const totalW = columns.reduce((s, c) => s + (c.width || 120), 0);
  const cellPad = dense ? '5px 10px' : '7px 12px';

  const rowBg = (ri) => (zebra && ri % 2 ? '#FCFCFD' : '#FFFFFF');
  const syncPins = (tr, bg) => tr.querySelectorAll('td.pin').forEach(td => {
    td.style.background = bg; const m = td.querySelector('.pinmask'); if (m) m.style.background = bg;
  });

  const caret = (c) => {
    if (c.sortable === false) return null;
    const active = sortKey === c.key;
    return <span style={{ marginLeft: 4, fontSize: active ? 10 : 9, color: active ? 'var(--accent)' : 'var(--text-3)', opacity: active ? 1 : 0.5 }}>{active ? (dir === 'asc' ? '▲' : '▼') : '↕'}</span>;
  };

  if (!rows.length) {
    return (
      <div style={{ border: '1px solid var(--border)', borderRadius: 14, background: 'var(--surface)', boxShadow: 'var(--card-shadow)' }}>
        <EmptyState label={empty || 'Nothing to show yet'} />
      </div>
    );
  }

  return (
    <div style={{ border: '1px solid var(--border)', borderRadius: 14, overflow: 'hidden', background: 'var(--surface)',
      boxShadow: 'var(--card-shadow)', display: 'flex', flexDirection: 'column',
      height: fit ? '100%' : undefined, minHeight: 0 }}>
      <div ref={scRef} className="h-scroller" style={{ overflowX: 'auto', overflowY: 'visible', flex: fit ? 1 : undefined, minHeight: 0 }}>
        <table style={{ width: '100%', minWidth: totalW, borderCollapse: 'collapse', fontSize: 12.5, tableLayout: 'fixed' }}>
          <colgroup>{columns.map((c, i) => <col key={i} style={{ width: c.width || 120 }} />)}</colgroup>
          <thead>
            <tr>
              {columns.map((c, i) => {
                const pinned = i < pinLeft, last = i === pinLeft - 1;
                return (
                  <th key={c.key} onClick={() => handleSort(c)}
                    title={c.sortable === false ? undefined : 'Sort by ' + c.label}
                    style={{ padding: cellPad, textAlign: c.align || 'left', fontSize: 10, fontWeight: 700,
                      color: sortKey === c.key ? 'var(--accent)' : 'var(--text-2)', textTransform: 'uppercase', letterSpacing: '.05em',
                      cursor: c.sortable === false ? 'default' : 'pointer', userSelect: 'none', whiteSpace: 'nowrap',
                      overflow: 'hidden', textOverflow: 'ellipsis', borderBottom: '2px solid var(--border)',
                      background: '#FAFBFC', position: 'sticky', top: 0,
                      zIndex: pinned ? 5 : 3, left: pinned ? lefts[i] : undefined,
                      boxShadow: last && scrolled ? '2px 0 6px rgba(0,0,0,.10)' : undefined }}>
                    {last && scrolled && <div style={{ position: 'absolute', top: 0, bottom: 0, left: '100%', width: STICKY_MASK, background: '#FAFBFC', pointerEvents: 'none' }} />}
                    {c.label}{caret(c)}
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody ref={bodyRef}>
            {pageRows.map((row, ri) => {
              const bg = row.__bg || rowBg(ri);
              return (
                <tr key={ri}
                  onMouseEnter={e => { e.currentTarget.style.background = '#F9FAFB'; syncPins(e.currentTarget, '#F9FAFB'); }}
                  onMouseLeave={e => { e.currentTarget.style.background = bg; syncPins(e.currentTarget, bg); }}
                  onClick={onRowClick ? () => onRowClick(row) : undefined}
                  onKeyDown={onRowClick ? (e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onRowClick(row); } }) : undefined}
                  tabIndex={onRowClick ? 0 : undefined}
                  role={onRowClick ? 'button' : undefined}
                  title={onRowClick ? 'Open details' : undefined}
                  style={{ borderBottom: '1px solid #F3F4F6', background: bg, cursor: onRowClick ? 'pointer' : undefined }}>
                  {columns.map((c, i) => {
                    const pinned = i < pinLeft, last = i === pinLeft - 1;
                    const content = c.render ? c.render(row) : row[c.key];
                    const raw = c.render ? undefined : (row[c.key] == null ? undefined : String(row[c.key]));
                    return (
                      <td key={c.key} className={pinned ? 'pin' : undefined} title={c.title ? c.title(row) : raw}
                        style={{ padding: cellPad, textAlign: c.align || 'left', whiteSpace: c.wrap ? 'normal' : 'nowrap',
                          overflow: 'hidden', textOverflow: 'ellipsis',
                          fontFamily: c.mono ? 'var(--mono)' : 'var(--font)', fontWeight: c.bold ? 700 : (c.mono ? 600 : 450),
                          fontSize: c.mono ? 11 : 12, color: c.color || 'var(--text)',
                          position: pinned ? 'sticky' : undefined, left: pinned ? lefts[i] : undefined, zIndex: pinned ? 2 : undefined,
                          background: pinned ? bg : undefined,
                          boxShadow: last && scrolled ? '2px 0 6px rgba(0,0,0,.10)' : undefined }}>
                        {last && scrolled && <div className="pinmask" style={{ position: 'absolute', top: 0, bottom: 0, left: '100%', width: STICKY_MASK, background: bg, pointerEvents: 'none' }} />}
                        {content}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
            {/* Filler rows keep every page the same height, so paging never
                makes the card jump — pagination is the only height control and
                the body never needs its own scrollbar. */}
            {paginated && pageRows.length < size && Array.from({ length: size - pageRows.length }).map((_, i) => (
              <tr key={'f' + i} aria-hidden="true" style={{ borderBottom: '1px solid #F3F4F6', background: rowBg(pageRows.length + i) }}>
                {columns.map((c, ci) => {
                  const pinned = ci < pinLeft;
                  return (
                    <td key={c.key} className={pinned ? 'pin' : undefined}
                      style={{ padding: 0, height: rowH || (dense ? 28 : 35),
                        position: pinned ? 'sticky' : undefined, left: pinned ? lefts[ci] : undefined,
                        zIndex: pinned ? 2 : undefined, background: pinned ? rowBg(pageRows.length + i) : undefined }}>
                      &nbsp;
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {paginated && (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 12px',
          borderTop: '1px solid var(--border)', background: '#FAFBFC', flexShrink: 0 }}>
          <div style={{ fontSize: 11, color: 'var(--text-3)' }}>{page * size + 1}–{Math.min(sorted.length, (page + 1) * size)} of {sorted.length}</div>
          <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
            <PgBtn label="‹" disabled={page === 0} onClick={() => setPage(p => Math.max(0, p - 1))} />
            {Array.from({ length: nPages }, (_, i) => i).filter(i => Math.abs(i - page) <= 2 || i === 0 || i === nPages - 1).map((i, idx, a) => (
              <React.Fragment key={i}>
                {idx > 0 && a[idx - 1] !== i - 1 && <span style={{ color: 'var(--text-3)', fontSize: 12 }}>…</span>}
                <PgBtn label={i + 1} active={i === page} onClick={() => setPage(i)} />
              </React.Fragment>
            ))}
            <PgBtn label="›" disabled={page === nPages - 1} onClick={() => setPage(p => Math.min(nPages - 1, p + 1))} />
          </div>
        </div>
      )}
    </div>
  );
}

/* Horizontal bar row — preferred over a charting library for simple comparisons */
function HBar({ items, valueFmt, height, barColor = 'var(--accent)', labelWidth = 132 }) {
  const max = Math.max(1, ...items.map(i => Math.abs(i.value || 0)));
  const fmt = valueFmt || (v => v);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
      {items.map((it, i) => (
        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div title={it.label} style={{ width: labelWidth, flexShrink: 0, fontSize: 11, color: 'var(--text-2)', fontWeight: 500,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textAlign: 'right' }}>{it.label}</div>
          <div style={{ flex: 1, minWidth: 0, background: 'var(--surface-2)', borderRadius: 5, height: height || 20, position: 'relative', overflow: 'hidden' }}>
            <div style={{ width: `${(Math.abs(it.value || 0) / max) * 100}%`, height: '100%', background: it.color || barColor, borderRadius: 5, transition: 'width .45s cubic-bezier(.22,1,.36,1)', minWidth: 2 }} />
          </div>
          <div style={{ width: 44, flexShrink: 0, fontFamily: 'var(--mono)', fontSize: 10.5, fontWeight: 700, color: 'var(--text)', textAlign: 'right' }}>{fmt(it.value)}</div>
        </div>
      ))}
    </div>
  );
}

/* Stacked two-series bar row (open vs critical-path) */
function StackBar({ items, keys, colors, legend }) {
  const max = Math.max(1, ...items.map(i => keys.reduce((a, k) => a + (i[k] || 0), 0)));
  return (
    <div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
        {items.map((it, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div title={it.label} style={{ width: 120, flexShrink: 0, fontSize: 11.5, color: 'var(--text-2)', fontWeight: 500,
              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textAlign: 'right' }}>{it.label}</div>
            <div style={{ flex: 1, minWidth: 0, background: 'var(--surface-2)', borderRadius: 5, height: 20, display: 'flex', overflow: 'hidden' }}>
              {keys.map((k, j) => {
                const v = it[k] || 0;
                const pct = 100 * v / max;
                return (
                  <div key={j} title={`${legend ? legend[j] : k}: ${v}`}
                    style={{ width: pct + '%', height: '100%', background: colors[j],
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      transition: 'width .45s cubic-bezier(.22,1,.36,1)' }}>
                    {/* label the segment only when it is wide enough to stay legible */}
                    {v > 0 && pct >= 7 && (
                      <span style={{ fontFamily: 'var(--mono)', fontSize: 10, fontWeight: 600, color: '#fff', lineHeight: 1 }}>{v}</span>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{ width: 34, flexShrink: 0, fontFamily: 'var(--mono)', fontSize: 11.5, fontWeight: 700, color: 'var(--text)', textAlign: 'right' }}>
              {keys.reduce((a, k) => a + (it[k] || 0), 0)}
            </div>
          </div>
        ))}
      </div>
      {legend && (
        <div style={{ display: 'flex', gap: 14, marginTop: 12, flexWrap: 'wrap' }}>
          {legend.map((l, i) => (
            <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11, color: 'var(--text-2)', fontWeight: 500 }}>
              <span style={{ width: 9, height: 9, borderRadius: 3, background: colors[i], display: 'inline-block' }} />{l}
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

/* Donut — health mix. Counts are drawn on the arcs themselves so the split is
   readable without cross-referencing the legend. */
function Donut({ rag }) {
  const parts = [['Green', rag.Green || 0], ['Amber', rag.Amber || 0], ['Red', rag.Red || 0]].filter(p => p[1] > 0);
  const total = parts.reduce((a, p) => a + p[1], 0) || 1;
  const CX = 74, CY = 74, R = 54, SW = 15, C = 2 * Math.PI * R;
  let off = 0, angle = -90;
  const arcs = parts.map((p, i) => {
    const len = C * p[1] / total;
    const sweep = 360 * p[1] / total;
    const mid = (angle + sweep / 2) * Math.PI / 180;
    const node = {
      key: p[0], count: p[1], color: RAG_HEX[p[0]], len, off,
      sweep, x: CX + R * Math.cos(mid), y: CY + R * Math.sin(mid),
    };
    off += len; angle += sweep;
    return node;
  });
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
      <div style={{ position: 'relative', width: 148, height: 148 }}>
        <svg width="148" height="148" viewBox="0 0 148 148">
          <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--surface-2)" strokeWidth={SW} />
          {arcs.map(a => (
            <circle key={a.key} cx={CX} cy={CY} r={R} fill="none" stroke={a.color} strokeWidth={SW}
              strokeDasharray={a.len + ' ' + (C - a.len)} strokeDashoffset={-a.off}
              transform={'rotate(-90 ' + CX + ' ' + CY + ')'}>
              <title>{a.key}: {a.count}</title>
            </circle>
          ))}
          {/* segment counts, hidden on slivers too small to hold a glyph */}
          {arcs.filter(a => a.sweep >= 26).map(a => (
            <text key={'t' + a.key} x={a.x} y={a.y} textAnchor="middle" dominantBaseline="central"
              style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 700, fill: '#fff', pointerEvents: 'none' }}>
              {a.count}
            </text>
          ))}
        </svg>
        <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', pointerEvents: 'none' }}>

/* Planned vs forecast dumbbell. The slip segment is the message, so it is
   drawn in the programme's health colour with the delta labelled inline; the
   full span sits on a faint rail so every row reads against the same scale. */
function Dumbbell({ rows }) {
  const ds = rows.flatMap(r => [r.planned, r.forecast]).filter(Boolean).map(d => new Date(d + 'T00:00:00').getTime());
  if (!ds.length) return <EmptyState label="No go-live dates available" />;
  const min = Math.min(...ds), max = Math.max(...ds), span = (max - min) || 1;
  const pos = (d) => d ? 100 * (new Date(d + 'T00:00:00').getTime() - min) / span : null;
  const ticks = [0, 0.5, 1].map(f => new Date(min + f * span));
  const LABEL = 168;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
      <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 14 }}>
        {rows.map((r, i) => {
          const a = pos(r.planned), b = pos(r.forecast);
          const late = r.variance_days > 0;
          const tone = RAG_HEX[r.rag] || '#9CA3AF';
          const lo = Math.min(a, b), hi = Math.max(a, b);
          return (
            <div key={i} style={{ display: 'grid', gridTemplateColumns: LABEL + 'px 1fr', alignItems: 'center', gap: 12 }}>
              <div title={r.project} style={{ fontSize: 12, fontWeight: 600, color: 'var(--text)',
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.project}</div>
              <div style={{ position: 'relative', height: 26 }}>
                {/* faint rail so each row shares one visible scale */}
                <div style={{ position: 'absolute', top: '50%', left: 0, right: 0, height: 4, borderRadius: 3,
                  background: 'var(--surface-2)', transform: 'translateY(-50%)' }} />
                {/* the slip itself */}
                {a != null && b != null && hi - lo > 0.4 && (
                  <div title={r.variance_days + ' days late'}
                    style={{ position: 'absolute', top: '50%', left: lo + '%', width: (hi - lo) + '%', height: 4,
                      borderRadius: 3, background: tone, opacity: .35, transform: 'translateY(-50%)' }} />
                )}
                {a != null && (
                  <div title={'Planned ' + fmtDate(r.planned)}
                    style={{ position: 'absolute', top: '50%', left: a + '%', transform: 'translate(-50%,-50%)',
                      width: 11, height: 11, borderRadius: '50%', background: 'var(--surface)',
                      border: '2.5px solid var(--accent)', boxSizing: 'border-box' }} />
                )}
                {b != null && (
                  <div title={'Forecast ' + fmtDate(r.forecast)}
                    style={{ position: 'absolute', top: '50%', left: b + '%', transform: 'translate(-50%,-50%)',
                      width: 12, height: 12, borderRadius: '50%', background: tone,
                      border: '2px solid var(--surface)', boxSizing: 'border-box', boxShadow: 'var(--card-shadow)' }} />
                )}
                {/* delta, placed just past the later marker */}
                <div style={{ position: 'absolute', top: '50%', left: 'min(' + (hi + 1.5) + '%, calc(100% - 62px))',
                  transform: 'translateY(-50%)', fontFamily: 'var(--mono)', fontSize: 10.5, fontWeight: 700,
                  color: late ? (r.variance_days > 21 ? 'var(--neg)' : 'var(--warn)') : 'var(--pos)', whiteSpace: 'nowrap' }}>
                  {late ? '+' + r.variance_days + 'd' : 'on plan'}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: LABEL + 'px 1fr', gap: 12, marginTop: 6, flexShrink: 0 }}>
        <span />
        <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-3)' }}>
          {ticks.map((t, i) => <span key={i}>{t.toLocaleDateString('en-US', { month: 'short', year: '2-digit' })}</span>)}
        </div>
      </div>
      <div style={{ display: 'flex', gap: 16, marginTop: 10, paddingLeft: LABEL + 12, flexShrink: 0, flexWrap: 'wrap' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11, color: 'var(--text-2)', fontWeight: 500 }}>
          <span style={{ width: 10, height: 10, borderRadius: '50%', background: 'var(--surface)', border: '2.5px solid var(--accent)', boxSizing: 'border-box' }} />
          Planned date
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11, color: 'var(--text-2)', fontWeight: 500 }}>
          <span style={{ display: 'inline-flex', gap: 2 }}>
            {['#059669', '#D97706', '#DC2626'].map(c => (
              <span key={c} style={{ width: 9, height: 9, borderRadius: '50%', background: c }} />
            ))}
          </span>
          Forecast date, coloured by health
        </span>
      </div>
    </div>
  );
}

/* Shared cell renderers */
function Variance({ v }) {
  if (v <= 0) return <span style={{ color: 'var(--pos)', fontWeight: 700, fontFamily: 'var(--mono)', fontSize: 11.5 }}>On plan</span>;
  return <span style={{ color: v > 21 ? 'var(--neg)' : 'var(--warn)', fontWeight: 700, fontFamily: 'var(--mono)', fontSize: 11.5 }}>+{v}d</span>;
}
function ProgressCell({ pct }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <div style={{ width: 54, height: 6, borderRadius: 4, background: 'var(--surface-2)', overflow: 'hidden', flexShrink: 0 }}>
        <div style={{ width: Math.round(pct) + '%', height: '100%', background: 'var(--accent)', borderRadius: 4, transition: 'width .45s cubic-bezier(.22,1,.36,1)' }} />
      </div>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 11.5, fontWeight: 600 }}>{Math.round(pct)}%</span>
    </div>
  );
}

/* Drill-down detail for a single programme */
function ProjectDetail({ p, onClose }) {
  const risks = (D.risk_register || []).filter(r => r.project === p.name);
  const miles = (D.milestones || []).filter(m => m.project === p.name);

    <div style={{ background: 'var(--surface-2)', borderRadius: 12, padding: '11px 13px' }}>

      <div style={{ fontFamily: 'var(--mono)', fontSize: 18, fontWeight: 700, letterSpacing: '-0.02em', marginTop: 4, color: color || 'var(--text)' }}>{value}</div>

        <span style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{p.phase} · owner {p.owner || '—'}</span>

        {stat('Variance', p.schedule_variance_days > 0 ? '+' + p.schedule_variance_days + 'd' : 'On plan', p.schedule_variance_days > 21 ? 'var(--neg)' : (p.schedule_variance_days > 0 ? 'var(--warn)' : 'var(--pos)'))}

      <div style={{ fontSize: 12.5, color: 'var(--text-2)', lineHeight: 1.55, marginBottom: 18, maxWidth: '75ch' }}>{p.recommendation}</div>

        <div>

async function gemma() {
  const s = D.summary, key = window.GEMINI_KEY;
  const sys = "You are the explainable-AI module of an enterprise project-governance platform. Given portfolio telemetry, write a concise executive briefing of 4-5 sentences: overall health, the projects driving risk and why, and the single most important action. Use ONLY the numbers provided. Plain prose only: no markdown, no lists, no chain-of-thought.";
  const lines = [`Portfolio: ${s.project_count} programmes, health ${s.portfolio_health}, RAG ${s.rag.Red}/${s.rag.Amber}/${s.rag.Green}, avg complete ${s.avg_complete}%, avg risk ${s.avg_risk}, slipping ${s.slipping}, critical risks ${s.critical_risks}, next go-live ${s.next_go_live}.`, 'Projects:']
    .concat(D.projects.map(p => `- ${p.name}: ${p.rag}, risk ${p.risk_score}, ${p.phase}, ${p.pct_complete}% complete, variance ${p.schedule_variance_days}d, crit/high ${p.risk_counts.Critical}/${p.risk_counts.High}.`));
  const body = { systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text: lines.join('\n') }] }], generationConfig: { temperature: 0.5, maxOutputTokens: 8192 } };
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemma-4-26b-a4b-it:generateContent?key=' + encodeURIComponent(key),
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  const c = (d.candidates || [])[0] || {};
  const parts = ((c.content || {}).parts) || [];
  const t = parts.filter(x => !x.thought).map(x => x.text || '').join('').trim();
  if (!t) throw new Error('empty');
  return t;
}

    const name = `${base}_${stamp()}.csv`;

/* ------------------------------------------------------------------ *
 *  Editable task grid                                                 *
 * ------------------------------------------------------------------ */
const STATUS_OPTIONS = ['Not Started', 'In Progress', 'Complete', 'Blocked'];
const RISK_OPTIONS = ['', 'Low', 'Medium', 'High', 'Critical'];
const PRIORITY_OPTIONS = ['', 'Low', 'Medium', 'High'];

/* One cell. At rest it renders the value the way the rest of the dashboard
   would — a pill, a bar, an avatar — and only becomes an input once clicked.
   Enter or blur commits, Escape reverts. */
function EditCell({ value, field, onCommit, edited, display, align, minH = 30 }) {
  const [editing, setEditing] = useState(false);
  const [hover, setHover] = useState(false);
  const [draft, setDraft] = useState(value == null ? '' : String(value));
  const ref = useRef(null);
  useEffect(() => { if (!editing) setDraft(value == null ? '' : String(value)); }, [value, editing]);
  useEffect(() => { if (editing && ref.current) { ref.current.focus(); if (ref.current.select) ref.current.select(); } }, [editing]);

  const isSelect = field === 'status' || field === 'risk_level' || field === 'priority';
  const isNum = ['pct_complete', 'effort', 'effort_completed', 'effort_remaining'].indexOf(field) >= 0;
  const isDate = field === 'planned_start' || field === 'planned_finish';
  const blank = value == null || value === '';

  const commit = (v) => {
    setEditing(false);
    const next = v == null ? draft : v;
    if (String(next) !== String(value == null ? '' : value)) onCommit(next);
  };

  if (!editing) {
    return (
      <div title={edited ? 'Edited — click to change' : 'Click to edit'}
        onClick={() => setEditing(true)}
        onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); setEditing(true); } }}
        onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        tabIndex={0}
        style={{ padding: '3px 7px', borderRadius: 6, minHeight: minH, display: 'flex', alignItems: 'center',
          justifyContent: align === 'right' ? 'flex-end' : 'flex-start', cursor: 'pointer', minWidth: 0,
          fontFamily: isNum ? 'var(--mono)' : 'var(--font)', fontSize: isNum ? 11.5 : 12,
          fontWeight: isNum ? 600 : 450, color: blank ? 'var(--text-3)' : 'var(--text)', outline: 'none',
          background: edited ? 'var(--accent-surface)' : (hover ? 'var(--hover)' : 'transparent'),
          boxShadow: edited ? 'inset 0 0 0 1px var(--accent-border)' : (hover ? 'inset 0 0 0 1px var(--border)' : 'none'),
          transition: 'background .12s, box-shadow .12s' }}>
        {display ? display(value) : (blank ? '—' : String(value))}
      </div>
    );
  }

  const inputStyle = {
    width: '100%', padding: '4px 7px', border: '1px solid var(--accent)', borderRadius: 6,
    outline: 'none', boxShadow: '0 0 0 3px var(--accent-surface)', background: 'var(--surface)',
    fontFamily: isNum ? 'var(--mono)' : 'var(--font)', fontSize: isNum ? 11.5 : 12, color: 'var(--text)',
    textAlign: align === 'right' ? 'right' : 'left',
  };
  const wrap = { minHeight: minH, display: 'flex', alignItems: 'center' };

  if (isSelect) {
    const opts = field === 'status' ? STATUS_OPTIONS : field === 'risk_level' ? RISK_OPTIONS : PRIORITY_OPTIONS;
    return (
      <div style={wrap}>
        <select ref={ref} value={draft} style={inputStyle}
          onChange={e => commit(e.target.value)} onBlur={() => setEditing(false)}>
          {opts.map(o => <option key={o} value={o}>{o || '—'}</option>)}
        </select>
      </div>
    );
  }
  return (
    <div style={wrap}>
      <input ref={ref} value={draft} type={isDate ? 'date' : (isNum ? 'number' : 'text')}
        style={inputStyle}
        onChange={e => setDraft(e.target.value)}
        onBlur={() => commit()}
        onKeyDown={e => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          else if (e.key === 'Escape') { e.preventDefault(); setDraft(value == null ? '' : String(value)); setEditing(false); }
        }} />
    </div>
  );
}

/* The plan grid. Same frozen-column, sorted, paginated behaviour as the
   read-only tables, so the editable view reads as part of the same console
   rather than a spreadsheet bolted on. */
function EditableGrid({ rows, columns, pending, onEdit, pinLeft = 1, pageSize = 14, fit,
                        initialSort, initialDir = 'asc', empty }) {
  const [sortKey, setSortKey] = useState(initialSort || null);
  const [dir, setDir] = useState(initialDir);
  const [scrolled, setScrolled] = useState(false);
  const [page, setPage] = useState(0);
  const [rowH, setRowH] = useState(0);
  const scRef = useRef(null);
  const bodyRef = useRef(null);
  const headRef = useRef(null);
  const footRef = useRef(null);

  useEffect(() => {
    const el = scRef.current; if (!el) return;
    let raf = 0;
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => setScrolled(el.scrollLeft > 0)); };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => { el.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
  }, []);

  // Sorting reads the pending value where one exists, so a row that was just
  // edited sorts by what the screen shows, not by the stale server value.
  const cellValue = (row, key) => {
    const rp = (pending[row._project] || {})[String(row._row)] || {};
    return Object.prototype.hasOwnProperty.call(rp, key) ? rp[key] : row[key];
  };

  const sorted = useMemo(() => {
    if (!sortKey) return rows;
    const col = columns.find(c => c.key === sortKey);
    const arr = [...rows];
    arr.sort((a, b) => {
      let x = col && col.sortVal ? col.sortVal(a) : cellValue(a, sortKey);
      let y = col && col.sortVal ? col.sortVal(b) : cellValue(b, sortKey);
      const nx = Number(x), ny = Number(y);
      const numeric = !isNaN(nx) && !isNaN(ny) && x !== '' && x != null && y !== '' && y != null;
      const r = numeric ? nx - ny : String(x == null ? '' : x).localeCompare(String(y == null ? '' : y));
      return dir === 'asc' ? r : -r;
    });
    return arr;
  }, [rows, sortKey, dir, columns, pending]);

  useEffect(() => {
    const el = bodyRef.current;
    if (!el) return;
    const first = el.querySelector('tr:not([aria-hidden])');
    if (first) {
      const h = Math.round(first.getBoundingClientRect().height);
      if (h && h !== rowH) setRowH(h);
    }
  });

  // fit: fill the card exactly. A height budget is only ever an estimate —
  // borders, sub-pixel rows and a footer that has not settled all throw it off
  // — so seed from one, then correct against what actually rendered until the
  // last row sits on the pagination bar. Measuring beats predicting.
  const [auto, setAuto] = useState({ n: 0, spacer: 0 });

  useEffect(() => {
    if (!fit) return;
    const el = scRef.current && scRef.current.parentElement;
    if (!el || !window.ResizeObserver) return;
    const seed = () => {
      const head = headRef.current ? headRef.current.getBoundingClientRect().height : 34;
      const foot = footRef.current ? footRef.current.getBoundingClientRect().height : 45;
      const per = rowH || 40;
      const n = Math.max(4, Math.floor((el.clientHeight - head - foot) / per));
      setAuto(prev => (prev.n === n ? prev : { n, spacer: 0 }));
    };
    seed();
    const ro = new ResizeObserver(seed);
    ro.observe(el);
    return () => ro.disconnect();
  }, [fit, rowH]);

  useEffect(() => {
    if (!fit || !auto.n) return;
    const sc = scRef.current, foot = footRef.current;
    const tbl = sc && sc.querySelector('table');
    if (!tbl || !foot) return;
    // The room the rows have, with the spacer's own contribution taken back
    // out: left in, the spacer hides the slack it just filled and a row that
    // would genuinely fit could never be added.
    const room = Math.round(foot.getBoundingClientRect().top - tbl.getBoundingClientRect().bottom) + auto.spacer;
    const per = rowH || 40;
    // Grow, shrink, or absorb the sub-row remainder. Setting the spacer to the
    // measured room rather than adding to it keeps this from drifting.
    if (room >= per + 1) setAuto(a => ({ n: a.n + Math.floor(room / per), spacer: 0 }));
    else if (room < 0) setAuto(a => ({ n: Math.max(4, a.n - Math.max(1, Math.ceil(-room / per))), spacer: 0 }));
    else if (Math.abs(room - auto.spacer) > 2) setAuto(a => ({ n: a.n, spacer: room }));
  });

  const size = fit && auto.n ? auto.n : pageSize;
  const nPages = Math.max(1, Math.ceil(sorted.length / size));
  useEffect(() => { if (page > nPages - 1) setPage(0); }, [nPages, page]);
  const view = sorted.slice(page * size, page * size + size);

  const handleSort = (c) => {
    if (c.sortable === false) return;
    if (sortKey === c.key) setDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(c.key); setDir(c.defaultDesc ? 'desc' : 'asc'); }
    setPage(0);
  };

  const lefts = []; let acc = 0;
  columns.forEach((c, i) => { lefts[i] = acc; if (i < pinLeft) acc += (c.width || 120); });
  const totalW = columns.reduce((a, c) => a + (c.width || 120), 0);

  const rowBg = (ri) => (ri % 2 ? '#FCFCFD' : '#FFFFFF');
  const syncPins = (tr, bg) => tr.querySelectorAll('td.pin').forEach(td => {
    td.style.background = bg; const m = td.querySelector('.pinmask'); if (m) m.style.background = bg;
  });

  const caret = (c) => {
    if (c.sortable === false) return null;
    const active = sortKey === c.key;
    return <span style={{ marginLeft: 4, fontSize: active ? 10 : 9, color: active ? 'var(--accent)' : 'var(--text-3)', opacity: active ? 1 : 0.5 }}>{active ? (dir === 'asc' ? '▲' : '▼') : '↕'}</span>;
  };

  if (!rows.length) {
    return (
      <div style={{ border: '1px solid var(--border)', borderRadius: 14, background: 'var(--surface)',
        boxShadow: 'var(--card-shadow)', height: fit ? '100%' : undefined, display: 'grid', placeItems: 'center' }}>
        <EmptyState label={empty || 'No rows match the filters'} hint="Clear a filter, or search for something else." />
      </div>
    );
  }

  return (
    <div style={{ border: '1px solid var(--border)', borderRadius: 14, overflow: 'hidden',
      background: 'var(--surface)', boxShadow: 'var(--card-shadow)', display: 'flex', flexDirection: 'column',
      height: fit ? '100%' : undefined, minHeight: 0 }}>
      <div ref={scRef} className="h-scroller" style={{ overflowX: 'auto', overflowY: 'visible', flex: fit ? 1 : undefined, minHeight: 0 }}>
        <table style={{ width: '100%', minWidth: totalW, borderCollapse: 'collapse', tableLayout: 'fixed' }}>
          <colgroup>{columns.map((c, i) => <col key={i} style={{ width: c.width || 120 }} />)}</colgroup>
          <thead ref={headRef}>
            <tr>
              {columns.map((c, i) => {
                const pinned = i < pinLeft, last = i === pinLeft - 1;
                return (
                  <th key={c.key} onClick={() => handleSort(c)}
                    title={c.sortable === false ? c.label : 'Sort by ' + c.label}
                    style={{ padding: '8px 10px', textAlign: c.align || 'left', fontSize: 9.5, fontWeight: 700,
                      color: sortKey === c.key ? 'var(--accent)' : (c.editable ? 'var(--text-2)' : 'var(--text-3)'),
                      textTransform: 'uppercase', letterSpacing: '.05em', whiteSpace: 'nowrap',
                      cursor: c.sortable === false ? 'default' : 'pointer', userSelect: 'none',
                      overflow: 'hidden', textOverflow: 'ellipsis', borderBottom: '2px solid var(--border)',
                      background: '#FAFBFC', position: 'sticky', top: 0,
                      zIndex: pinned ? 5 : 3, left: pinned ? lefts[i] : undefined,
                      boxShadow: last && scrolled ? '2px 0 6px rgba(0,0,0,.10)' : undefined }}>
                    {last && scrolled && <div style={{ position: 'absolute', top: 0, bottom: 0, left: '100%', width: STICKY_MASK, background: '#FAFBFC', pointerEvents: 'none' }} />}
                    {c.editable && <span style={{ color: 'var(--accent)', marginRight: 4, fontSize: 9 }}>✎</span>}
                    {c.label}{caret(c)}
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody ref={bodyRef}>
            {view.map((row, ri) => {
              const bg = rowBg(ri);
              const rowPending = (pending[row._project] || {})[String(row._row)] || {};
              return (
                <tr key={row._project + '|' + row._row}
                  onMouseEnter={e => { e.currentTarget.style.background = '#F9FAFB'; syncPins(e.currentTarget, '#F9FAFB'); }}
                  onMouseLeave={e => { e.currentTarget.style.background = bg; syncPins(e.currentTarget, bg); }}
                  style={{ borderBottom: '1px solid #F3F4F6', background: bg }}>
                  {columns.map((c, ci) => {
                    const pinned = ci < pinLeft, last = ci === pinLeft - 1;
                    const local = Object.prototype.hasOwnProperty.call(rowPending, c.key);
                    const server = (row._edited || []).indexOf(c.key) >= 0;
                    const val = local ? rowPending[c.key] : row[c.key];
                    return (
                      <td key={c.key} className={pinned ? 'pin' : undefined}
                        style={{ padding: '2px 4px', textAlign: c.align || 'left', verticalAlign: 'middle',
                          overflow: 'hidden', whiteSpace: 'nowrap',
                          position: pinned ? 'sticky' : undefined, left: pinned ? lefts[ci] : undefined,
                          zIndex: pinned ? 2 : undefined, background: pinned ? bg : undefined,
                          boxShadow: last && scrolled ? '2px 0 6px rgba(0,0,0,.10)' : undefined }}>
                        {last && scrolled && <div className="pinmask" style={{ position: 'absolute', top: 0, bottom: 0, left: '100%', width: STICKY_MASK, background: bg, pointerEvents: 'none' }} />}
                        {c.editable
                          ? <EditCell value={val} field={c.key} edited={local || server} align={c.align}
                              minH={c.minH} display={c.display ? (v => c.display(v, row)) : undefined}
                              onCommit={v => onEdit(row._project, row._row, c.key, v)} />
                          : <div style={{ padding: '3px 7px', minHeight: c.minH || 30, display: 'flex', alignItems: 'center',
                              justifyContent: c.align === 'right' ? 'flex-end' : 'flex-start', minWidth: 0,
                              color: c.muted ? 'var(--text-3)' : 'var(--text-2)',
                              fontFamily: c.mono ? 'var(--mono)' : 'var(--font)', fontSize: c.mono ? 11 : 12 }}>
                              {c.display ? c.display(val, row) : (val == null || val === '' ? '—' : String(val))}
                            </div>}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
            {view.length < size && Array.from({ length: size - view.length }).map((_, i) => (
              <tr key={'f' + i} aria-hidden="true" style={{ borderBottom: '1px solid #F3F4F6', background: rowBg(view.length + i) }}>
                {columns.map((c, ci) => {
                  const pinned = ci < pinLeft;
                  return (
                    <td key={c.key} className={pinned ? 'pin' : undefined}
                      style={{ padding: 0, height: rowH || 40,
                        position: pinned ? 'sticky' : undefined, left: pinned ? lefts[ci] : undefined,
                        zIndex: pinned ? 2 : undefined, background: pinned ? rowBg(view.length + i) : undefined }}>
                      &nbsp;
                    </td>
                  );
                })}
              </tr>
            ))}
            {fit && auto.spacer > 0 && (
              <tr aria-hidden="true" style={{ background: rowBg(size) }}>
                {columns.map((c, ci) => {
                  const pinned = ci < pinLeft;
                  return (
                    <td key={c.key} className={pinned ? 'pin' : undefined}
                      style={{ padding: 0, height: auto.spacer,
                        position: pinned ? 'sticky' : undefined, left: pinned ? lefts[ci] : undefined,
                        zIndex: pinned ? 2 : undefined, background: pinned ? rowBg(size) : undefined }}>
                      &nbsp;
                    </td>
                  );
                })}
              </tr>
            )}
          </tbody>
        </table>
      </div>
      <div ref={footRef} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 12px',
        borderTop: '1px solid var(--border)', background: '#FAFBFC', flexShrink: 0 }}>
        <div style={{ fontSize: 11, color: 'var(--text-3)' }}>
          {page * size + 1}–{Math.min(sorted.length, (page + 1) * size)} of {sorted.length} rows
        </div>
        {nPages > 1 && (
          <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
            <PgBtn label="‹" disabled={page === 0} onClick={() => setPage(p => Math.max(0, p - 1))} />
            {Array.from({ length: nPages }, (_, i) => i).filter(i => Math.abs(i - page) <= 2 || i === 0 || i === nPages - 1).map((i, idx, a) => (
              <React.Fragment key={i}>
                {idx > 0 && a[idx - 1] !== i - 1 && <span style={{ color: 'var(--text-3)', fontSize: 12 }}>…</span>}
                <PgBtn label={i + 1} active={i === page} onClick={() => setPage(i)} />
              </React.Fragment>
            ))}
            <PgBtn label="›" disabled={page === nPages - 1} onClick={() => setPage(p => Math.min(nPages - 1, p + 1))} />
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ *
 *  Budget — cost governance                                           *
 * ------------------------------------------------------------------ */
function BudgetPage() {
  const b = D.budget || { projects: [], summary: {} };
  const s = b.summary || {};
  const rows = b.projects || [];
  const [pick, setPick] = useState((rows[0] || {}).project);
  const sel = rows.find(r => r.project === pick) || rows[0];
  const breaching = rows.filter(r => r.projected_breach);

  const cols = [
    { key: 'project', label: 'Project', width: 190, bold: true },
    { key: 'approved_budget', label: 'Approved', width: 108, align: 'right', mono: true, defaultDesc: true,
      render: r => fmtMoney(r.approved_budget) },
    { key: 'actual_spend', label: 'Actual spend', width: 116, align: 'right', mono: true, defaultDesc: true,
      render: r => fmtMoney(r.actual_spend) },
    { key: 'budget_utilization', label: 'Utilisation', width: 118, align: 'right', defaultDesc: true,
      render: r => <UtilBar pct={r.budget_utilization} /> },
    { key: 'remaining_budget', label: 'Remaining', width: 108, align: 'right', mono: true,
      render: r => fmtMoney(r.remaining_budget) },
    { key: 'eac', label: 'Forecast (EAC)', width: 122, align: 'right', mono: true, defaultDesc: true,
      render: r => fmtMoney(r.eac) },
    { key: 'forecast_variance', label: 'Fcst variance', width: 122, align: 'right', defaultDesc: true,
      render: r => <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 700,
        color: r.forecast_variance < 0 ? 'var(--neg)' : 'var(--pos)' }}>{fmtMoney(r.forecast_variance)}</span> },
    { key: 'cost_vs_progress', label: 'Cost vs progress', width: 132, align: 'right', defaultDesc: true,
      render: r => <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 700,
        color: r.cost_vs_progress > 8 ? 'var(--neg)' : (r.cost_vs_progress > 0 ? 'var(--warn)' : 'var(--pos)') }}>
        {(r.cost_vs_progress > 0 ? '+' : '') + Math.round(r.cost_vs_progress)} pts</span> },
    { key: 'budget_health', label: 'Budget health', width: 116, render: r => <RagPill rag={r.budget_health} /> },
    { key: 'cost_risk_score', label: 'AI cost risk', width: 108, align: 'right', mono: true, defaultDesc: true },
  ];

  return (
    <div style={{ padding: '14px 22px 16px', display: 'flex', flexDirection: 'column', gap: 12,
      height: '100%', minHeight: 0, overflow: 'hidden' }}>
      <Insight tone={breaching.length ? 'neg' : (s.budget_health === 'Amber' ? 'warn' : 'pos')}
        icon={breaching.length ? 'alert' : 'check'}>
        {breaching.length
          ? <span><strong style={{ color: 'var(--text)', fontWeight: 700 }}>{breaching.length} programme{breaching.length > 1 ? 's are' : ' is'} forecast to exhaust its budget</strong> before the work is finished
              {breaching[0].breach_point ? <span>, first at <strong style={{ color: 'var(--text)', fontWeight: 700 }}>{breaching[0].breach_point.activity}</strong>
              {breaching[0].breach_point.date ? ' around ' + fmtDate(breaching[0].breach_point.date) : ''}</span> : null}.
              Portfolio forecast is {fmtMoney(s.eac)} against {fmtMoney(s.approved_budget)} approved.</span>
          : <span>All programmes are forecast to complete inside their approved budget. {fmtMoney(s.actual_spend)} of {fmtMoney(s.approved_budget)} consumed ({Math.round(s.budget_utilization)}%).</span>}
      </Insight>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 12, flexShrink: 0 }}>
        <KPI label="Approved budget" value={fmtMoney(s.approved_budget)} sub="portfolio total" />
        <KPI label="Actual spend" value={fmtMoney(s.actual_spend)} sub={Math.round(s.budget_utilization) + '% utilised'}
          spark={rows.map(r => ({ v: Math.max(r.budget_utilization, 2), c: RAG_HEX[r.budget_health], t: r.project }))} />
        <KPI label="Remaining" value={fmtMoney(s.remaining_budget)} sub="approved minus spend" />
        <KPI label="Forecast (EAC)" value={fmtMoney(s.eac)} sub="at completion"
          color={s.forecast_variance < 0 ? 'var(--neg)' : 'var(--pos)'} />
        <KPI label="Forecast variance" value={fmtMoney(s.forecast_variance)} sub={s.forecast_variance < 0 ? 'over budget' : 'under budget'}
          color={s.forecast_variance < 0 ? 'var(--neg)' : 'var(--pos)'} />
        <KPI label="Avg cost risk" value={s.avg_cost_risk} unit="/100" sub={(s.projected_breach_count || 0) + ' projected breach'}
          color={s.avg_cost_risk >= 60 ? 'var(--neg)' : s.avg_cost_risk >= 35 ? 'var(--warn)' : 'var(--pos)'} />
      </div>

      <div style={{ flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) minmax(330px, 380px)', gap: 12 }}>
        <div style={{ minHeight: 0, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
          <SectionLabel icon="budget" style={{ flexShrink: 0 }}>Cost by programme</SectionLabel>
          <div style={{ flexShrink: 0 }}>
            <DataTable columns={cols} rows={rows} pinLeft={1} pageSize={10} initialSort="cost_risk_score" initialDir="desc"
              onRowClick={r => setPick(r.project)} empty="No budget data" />
          </div>
          <div style={{ fontSize: 11.5, color: 'var(--text-3)', marginTop: 8 }}>
            Select a programme for its forecast drivers, then set its real approved budget and spend on the right.
          </div>
        </div>

        <Card title={sel ? sel.project : 'Budget detail'} desc="Forecast drivers and corrective action"
          style={{ display: 'flex', flexDirection: 'column', minHeight: 0 }}
          bodyStyle={{ flex: 1, minHeight: 0, overflow: 'auto' }}>
          {!sel ? <EmptyState label="Select a programme" /> : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                <RagPill rag={sel.budget_health} />
                <Pill text={'Cost risk ' + sel.cost_risk_score} color={sel.cost_risk_score >= 60 ? '#DC2626' : sel.cost_risk_score >= 35 ? '#D97706' : '#059669'} />
                {sel.edited && <Pill text="Edited" color="#4F46E5" />}
              </div>

              <UtilBar pct={sel.budget_utilization} big progress={sel.pct_complete} />

              {sel.breach_point && (
                <Banner tone="neg">
                  Budget exhausted after <strong>{sel.breach_point.tasks_in}</strong> of {sel.breach_point.tasks_remaining} remaining
                  tasks, at <strong>{sel.breach_point.activity}</strong>
                  {sel.breach_point.phase ? ' (' + sel.breach_point.phase + ')' : ''}
                  {sel.breach_point.date ? ' around ' + fmtDate(sel.breach_point.date) : ''}, over by {fmtMoney(sel.breach_point.overrun_at_point)}.
                </Banner>
              )}

              <div>
                <SectionLabel>Cost to complete</SectionLabel>
                <div style={{ fontFamily: 'var(--mono)', fontSize: 18, fontWeight: 700, marginBottom: 8 }}>{fmtMoney(sel.cost_to_complete)}</div>
                {(sel.heavy_remaining || []).length
                  ? <HBar items={sel.heavy_remaining.map(h => ({ label: h.activity, value: h.to_complete,
                      color: sel.projected_breach ? '--neg' : '--accent' }))}
                      valueFmt={v => fmtMoney(v)} height={15} labelWidth={128} />
                  : <div style={{ fontSize: 12, color: 'var(--text-3)' }}>No remaining work is costed.</div>}
              </div>

              <div>
                <SectionLabel>AI budget insight</SectionLabel>
                <div style={{ fontSize: 12.5, lineHeight: 1.6, color: 'var(--text-2)' }}>{sel.budget_insight}</div>
              </div>

              <BudgetEditor sel={sel} />

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, fontSize: 11.5 }}>
                {[['Basis', sel.basis === 'effort' ? 'Effort x rate' : 'Task count'],
                  ['Rate', '$' + sel.hourly_rate + '/h'],
                  ['Hours total', fmtHours(sel.hours_total)],
                  ['Hours remaining', fmtHours(sel.hours_remaining)],
                  ['CPI', sel.cpi == null ? '—' : sel.cpi],
                  ['Delivered', Math.round(sel.pct_complete) + '%']].map(kv => (
                  <div key={kv[0]} style={{ display: 'flex', justifyContent: 'space-between', gap: 8,
                    padding: '5px 0', borderBottom: '1px solid var(--border)' }}>
                    <span style={{ color: 'var(--text-3)' }}>{kv[0]}</span>
                    <span style={{ fontFamily: 'var(--mono)', fontWeight: 600 }}>{kv[1]}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}


/* Enter the real numbers. An approved budget or spend typed here overrides the
   estimate the engine derived from effort, and every cost figure recomputes. */
function BudgetEditor({ sel }) {
  const [bac, setBac] = useState('');
  const [ac, setAc] = useState('');
  const [rate, setRate] = useState('');
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  useEffect(() => { setBac(''); setAc(''); setRate(''); setErr(''); }, [sel && sel.project]);

  const dirty = bac !== '' || ac !== '' || rate !== '';

  function save() {
    if (!dirty) return;
    const vals = {};
    if (bac !== '') vals.approved_budget = bac;
    if (ac !== '') vals.actual_spend = ac;
    const body = { budget: { [sel.project]: vals } };
    if (rate !== '') body.hourly_rate = Number(rate);
    setErr(''); setBusy('Recomputing…');
    const e = hostSendJSON(body);
    if (e) { setBusy(''); setErr(e); }
  }

  const field = (label, value, set, placeholder) => (
    <label style={{ display: 'flex', flexDirection: 'column', gap: 3, minWidth: 0 }}>
      <span style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: '.05em', textTransform: 'uppercase', color: 'var(--text-3)' }}>{label}</span>
      <input value={value} onChange={e => set(e.target.value)} placeholder={placeholder} inputMode="decimal"
        onFocus={e => e.target.style.borderColor = 'var(--accent)'}
        onBlur={e => e.target.style.borderColor = 'var(--border)'}
        style={{ width: '100%', padding: '6px 9px', border: '1px solid var(--border)', borderRadius: 7,
          fontFamily: 'var(--mono)', fontSize: 11.5, color: 'var(--text)', outline: 'none', background: 'var(--surface)' }} />
    </label>
  );

  return (
    <div style={{ borderTop: '1px solid var(--border)', paddingTop: 12 }}>
      <SectionLabel>Set the real figures</SectionLabel>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
        {field('Approved', bac, setBac, String(Math.round(sel.approved_budget)))}
        {field('Actual spend', ac, setAc, String(Math.round(sel.actual_spend)))}
        {field('Rate $/h', rate, setRate, String(sel.hourly_rate))}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 9, flexWrap: 'wrap' }}>
        <Btn variant="primary" icon="save" onClick={save} disabled={!dirty || !!busy}>
          {dirty ? 'Apply' : 'No changes'}
        </Btn>
        {busy && <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontSize: 11.5, color: 'var(--text-2)' }}>
          <span style={{ width: 12, height: 12, border: '2px solid var(--accent)', borderTopColor: 'transparent',
            borderRadius: '50%', animation: 'spin .6s linear infinite' }} />{busy}</span>}
        {!busy && !dirty && <span style={{ fontSize: 11, color: 'var(--text-3)' }}>Overrides the estimate for this programme.</span>}
      </div>
      {err && <Banner tone="neg" style={{ marginTop: 8 }}>{err}</Banner>}
    </div>
  );
}

/* Utilisation against delivery: the bar is spend, the notch is progress. */
function UtilBar({ pct, big, progress }) {
  const p = Math.max(0, Math.min(140, Number(pct) || 0));
  const over = p > 100;
  const tone = over ? 'var(--neg)' : p > 90 ? 'var(--warn)' : 'var(--accent)';
  return (
    <div style={{ width: '100%' }}>
      <div style={{ position: 'relative', height: big ? 12 : 8, background: 'var(--surface-2)',
        borderRadius: 6, overflow: 'visible' }}>
        <div style={{ width: Math.min(p, 100) + '%', height: '100%', background: tone, borderRadius: 6,
          transition: 'width .45s cubic-bezier(.22,1,.36,1)' }} />
        {progress != null && (
          <div title={'Delivered ' + Math.round(progress) + '%'}
            style={{ position: 'absolute', top: -3, bottom: -3, left: Math.min(Math.max(progress, 0), 100) + '%',
              width: 2, background: 'var(--text)', opacity: .55 }} />
        )}
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4,
        fontFamily: 'var(--mono)', fontSize: big ? 11 : 10, color: over ? 'var(--neg)' : 'var(--text-2)', fontWeight: 600 }}>
        <span>{Math.round(p)}% spent</span>
        {progress != null && <span style={{ color: 'var(--text-3)' }}>{Math.round(progress)}% delivered</span>}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ *
 *  Data page — owns ingestion, drives the host's hidden widgets       *
 * ------------------------------------------------------------------ */
function hostDoc() {
  try { return window.parent && window.parent.document ? window.parent.document : null; } catch (e) { return null; }
}
function hostClick(key) {
  const d = hostDoc(); if (!d) return false;
  const btn = d.querySelector('.st-key-' + key + ' button');
  if (!btn) return false;
  btn.click(); return true;
}
function hostUpload(files) {
  const d = hostDoc(); if (!d) return 'Host not reachable.';
  const input = d.querySelector('.st-key-host_upload input[type="file"]')
    || d.querySelector('[data-testid="stFileUploaderDropzoneInput"]')
    || d.querySelector('input[type="file"]');
  if (!input) return 'Host uploader not found.';
  const dt = new DataTransfer();
  Array.from(files).forEach(f => dt.items.add(f));
  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'files').set;
  setter.call(input, dt.files);
  input.dispatchEvent(new Event('change', { bubbles: true }));
  return null;
}

/* Every plan format normalises onto one canonical model, and no two files
   fill the same amount of it. This reports what actually landed in each
   field, so a thin column is visible before it quietly weakens a metric. */
const SCHEMA_FIELDS = [
  ['activity', 'Activity'], ['phase', 'Phase'], ['wbs', 'WBS'], ['task_id', 'Task ID'],
  ['owner', 'Owner'], ['team', 'Team'], ['status', 'Status'], ['pct_complete', '% complete'],
  ['priority', 'Priority'], ['risk_level', 'Risk level'], ['critical_path', 'Critical path'],
  ['dependency', 'Dependency'], ['planned_start', 'Planned start'], ['planned_finish', 'Planned finish'],
  ['actual_start', 'Actual start'], ['actual_finish', 'Actual finish'],
  ['effort', 'Effort (h)'], ['effort_completed', 'Effort done'], ['effort_remaining', 'Effort left'],
];

function SchemaCoverage() {
  const tasks = D.tasks || [];
  const stats = useMemo(() => {
    const n = tasks.length || 1;
    return SCHEMA_FIELDS.map(f => {
      let filled = 0;
      for (let i = 0; i < tasks.length; i++) {
        const v = tasks[i][f[0]];
        if (v != null && v !== '') filled++;
      }
      return { key: f[0], label: f[1], pct: Math.round(filled * 100 / n), filled };
    });
  }, [tasks]);
  const thin = stats.filter(f => f.pct < 50);

  return (
    <Card title="Normalised schema" desc="How much of the canonical model each field carries">
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: '7px 22px' }}>
        {stats.map(f => (
          <div key={f.key} style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
            <span style={{ fontSize: 11.5, color: 'var(--text-2)', width: 96, flexShrink: 0,
              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.label}</span>
            <span style={{ flex: 1, minWidth: 20, height: 5, borderRadius: 3, background: 'var(--surface-2)', overflow: 'hidden' }}>
              <span style={{ display: 'block', width: f.pct + '%', height: '100%', borderRadius: 3,
                background: f.pct >= 85 ? 'var(--pos)' : f.pct >= 50 ? 'var(--warn)' : 'var(--neg)' }} />
            </span>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 10.5, fontWeight: 600, width: 32, textAlign: 'right',
              color: f.pct >= 85 ? 'var(--text)' : 'var(--text-3)' }}>{f.pct}%</span>
          </div>
        ))}
      </div>
      <div style={{ fontSize: 11.5, color: 'var(--text-3)', marginTop: 13, lineHeight: 1.5,
        borderTop: '1px solid var(--border)', paddingTop: 11 }}>
        {thin.length
          ? <span><strong style={{ color: 'var(--text-2)', fontWeight: 650 }}>{thin.map(f => f.label).join(', ')}</strong> {thin.length > 1 ? 'are' : 'is'} sparsely filled across {tasks.length.toLocaleString()} rows. Metrics that lean on {thin.length > 1 ? 'them' : 'it'} are inferred from what the plan does carry.</span>
          : <span>Every canonical field is well populated across {tasks.length.toLocaleString()} rows — no metric is running on inferred data.</span>}
      </div>
    </Card>
  );
}

/* ------------------------------------------------------------------ *
 *  Plan Data — the ingested plan, cell by cell                        *
 * ------------------------------------------------------------------ */
const PHASE_PALETTE = ['#4F46E5', '#0891B2', '#059669', '#D97706', '#DB2777', '#7C3AED', '#0EA5E9', '#65A30D'];

function statusHex(s) {
  const t = String(s == null ? '' : s).toLowerCase();
  if (!t) return '#9CA3AF';
  if (t.indexOf('block') >= 0 || t.indexOf('hold') >= 0) return '#DC2626';
  if (t.indexOf('complete') >= 0 || t.indexOf('done') >= 0) return '#059669';
  if (t.indexOf('not started') >= 0 || t.indexOf('not-started') >= 0) return '#9CA3AF';
  if (t.indexOf('progress') >= 0 || t.indexOf('active') >= 0) return '#4F46E5';
  return '#9CA3AF';
}

function PlanDataPage() {
  const all = D.tasks || [];
  const projects = Array.from(new Set(all.map(r => r._project)));
  const [proj, setProj] = useState(projects[0]);
  const [q, setQ] = useState('');
  const [status, setStatus] = useState('All');
  const [phase, setPhase] = useState('All');
  const [gatesOnly, setGatesOnly] = useState(false);
  const [editedOnly, setEditedOnly] = useState(false);
  // The grid reads as a report until editing is explicitly switched on, so a
  // stray click on a cell can never change the plan behind the dashboard.
  const [editMode, setEditMode] = useState(false);
  const [pending, setPending] = useState({});
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');

  const projRows = useMemo(() => all.filter(r => r._project === proj), [all, proj]);

  // Phases keep the order they appear in the plan, so their colours read as a
  // delivery sequence rather than an arbitrary palette.
  const phases = useMemo(() => {
    const seen = [];
    projRows.forEach(r => { if (r.phase && seen.indexOf(r.phase) < 0) seen.push(r.phase); });
    return seen;
  }, [projRows]);
  const phaseHex = useMemo(() => {
    const m = {};
    phases.forEach((p, i) => { m[p] = PHASE_PALETTE[i % PHASE_PALETTE.length]; });
    return m;
  }, [phases]);

  const statuses = useMemo(() => {
    const seen = [];
    projRows.forEach(r => { if (r.status && seen.indexOf(r.status) < 0) seen.push(r.status); });
    return seen;
  }, [projRows]);

  const rows = useMemo(() => {
    const t = q.trim().toLowerCase();
    let arr = projRows;
    if (phase !== 'All') arr = arr.filter(r => r.phase === phase);
    if (status !== 'All') arr = arr.filter(r => r.status === status);
    if (gatesOnly) arr = arr.filter(r => !!r.critical_path);
    if (editedOnly) arr = arr.filter(r => (r._edited || []).length > 0
      || Object.keys(((pending[r._project] || {})[String(r._row)]) || {}).length > 0);
    if (t) arr = arr.filter(r => [r.activity, r.phase, r.owner, r.team, r.status, r.wbs, r.task_id]
      .some(v => String(v == null ? '' : v).toLowerCase().includes(t)));
    return arr;
  }, [projRows, q, status, phase, gatesOnly, editedOnly, pending]);

  const stats = useMemo(() => {
    const owners = new Set();
    let effort = 0, pct = 0, n = 0, gates = 0;
    projRows.forEach(r => {
      if (r.owner) owners.add(r.owner);
      if (r.effort != null && !isNaN(Number(r.effort))) effort += Number(r.effort);
      if (r.pct_complete != null && !isNaN(Number(r.pct_complete))) { pct += Number(r.pct_complete); n++; }
      if (r.critical_path) gates++;
    });
    return { owners: owners.size, effort, avg: n ? Math.round(pct / n) : 0, gates };
  }, [projRows]);

  const count = Object.keys(pending).reduce((a, p) =>
    a + Object.keys(pending[p]).reduce((b, r) => b + Object.keys(pending[p][r]).length, 0), 0);
  const serverEdits = D.edit_count || 0;

  function onEdit(project, rowIdx, field, value) {

      return next;
    });

  function apply() {
    if (!count) return;
    setErr(''); setBusy('Applying ' + count + ' edit' + (count > 1 ? 's' : '') + ' and recomputing…');
    const e = hostSendJSON({ cells: pending });
    if (e) { setBusy(''); setErr(e); }
  }
  function discard() { setPending({}); setErr(''); }
  function cancelEditing() { setPending({}); setErr(''); setEditMode(false); }
  function resetAll() {
    setErr(''); setBusy('Restoring the uploaded data…');
    const e = hostSendJSON({ reset: true });
    if (e) { setBusy(''); setErr(e); }
  }
  function resetFilters() { setQ(''); setStatus('All'); setPhase('All'); setGatesOnly(false); setEditedOnly(false); }

  const today = new Date().toISOString().slice(0, 10);

  const columns = [
    { key: 'activity', label: 'Activity', width: 290, editable: true, minH: 38,
      display: (v, row) => (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0, width: '100%' }}>
          <span style={{ width: 3, alignSelf: 'stretch', minHeight: 26, borderRadius: 2, flexShrink: 0,
            background: phaseHex[row.phase] || 'var(--border)' }} />
          <span style={{ minWidth: 0, lineHeight: 1.25 }}>
            <span style={{ display: 'block', fontSize: 12, fontWeight: 600, color: v ? 'var(--text)' : 'var(--text-3)',

            <span style={{ display: 'block', fontFamily: 'var(--mono)', fontSize: 9.5, color: 'var(--text-3)', marginTop: 1,
              overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {[row.wbs, row.task_id].filter(Boolean).join(' · ') || '—'}
            </span>
          </span>
        </div>
      ) },
    { key: 'phase', label: 'Phase', width: 150, editable: true,
      display: v => v ? <Pill text={v} color={phaseHex[v] || '#6B7280'} style={{ maxWidth: '100%', overflow: 'hidden' }} /> : <span style={{ color: 'var(--text-3)' }}>—</span> },
