      } },
    { key: 'owner', label: 'Owner', width: 168, editable: true,
      display: v => v ? <OwnerCell name={v} /> : <span style={{ color: 'var(--text-3)' }}>Unassigned</span> },
    { key: 'team', label: 'Team', width: 136, editable: true },
    { key: 'risk_level', label: 'Risk', width: 116, editable: true,
      display: v => v ? <LevelPill level={v} /> : <span style={{ color: 'var(--text-3)' }}>—</span> },
    { key: 'priority', label: 'Priority', width: 112, editable: true,
      display: v => v ? <Pill text={v} color={LEVEL_HEX[v] || '#6B7280'} /> : <span style={{ color: 'var(--text-3)' }}>—</span> },
    { key: 'critical_path', label: 'Gate', width: 92, sortable: true, sortVal: r => (r.critical_path ? 1 : 0),
      display: v => v
        ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11, fontWeight: 700, color: 'var(--accent)' }}>◆ Gate</span>
        : <span style={{ color: 'var(--text-3)' }}>—</span> },
    { key: 'effort', label: 'Effort', width: 96, align: 'right', editable: true,
      display: v => <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600 }}>{fmtHours(v)}</span> },
    { key: 'effort_completed', label: 'Done', width: 92, align: 'right', editable: true,
      display: v => <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--pos)', fontWeight: 600 }}>{fmtHours(v)}</span> },
    { key: 'effort_remaining', label: 'Left', width: 92, align: 'right', editable: true,
      display: v => <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-2)', fontWeight: 600 }}>{fmtHours(v)}</span> },
    { key: 'planned_start', label: 'Planned start', width: 124, editable: true,
      display: v => <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-2)' }}>{fmtDate(v)}</span> },
    { key: 'planned_finish', label: 'Planned finish', width: 130, editable: true,
      display: (v, row) => {
        const late = v && v < today && statusHex(row.status) !== '#059669';
        return <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: late ? 700 : 400,
          color: late ? 'var(--neg)' : 'var(--text-2)' }}>{fmtDate(v)}</span>;
      } },
    { key: 'dependency', label: 'Depends on', width: 140, muted: true },
  ];

  if (!all.length) {
    return (
      <div style={{ padding: '14px 22px 16px', height: '100%', display: 'grid', placeItems: 'center' }}>
        <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14,
          boxShadow: 'var(--card-shadow)', padding: '10px 30px' }}>
          <EmptyState label="No plan data loaded" hint="Upload a workbook on the Data page, or load the sample portfolio." />
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding: '14px 22px 16px', display: 'flex', flexDirection: 'column', gap: 10,
      height: '100%', minHeight: 0, overflow: 'hidden' }}>

      {/* Vital signs for the plan on screen */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap', flexShrink: 0 }}>
        <SectionLabel icon="edit" style={{ marginBottom: 0, marginRight: 2 }}>Plan data</SectionLabel>
        <StatChip value={projRows.length.toLocaleString()} label="rows" />
        <StatChip value={phases.length} label="phases" />
        <StatChip value={stats.owners} label="owners" />
        <StatChip value={fmtHours(stats.effort)} label="effort" />
        <StatChip value={stats.gates} label="gates" color="var(--accent)" />
        <StatChip value={stats.avg + '%'} label="complete" color={stats.avg >= 66 ? 'var(--pos)' : stats.avg >= 33 ? 'var(--warn)' : 'var(--neg)'} bar={stats.avg} />
        {(count > 0 || serverEdits > 0) && (
          <StatChip value={count + serverEdits}
            label={(count + serverEdits === 1 ? 'edit' : 'edits') + (count ? ' staged' : ' applied')}
            color="var(--accent)" />
        )}
        {editMode && (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '5px 11px', borderRadius: 9,
            background: 'var(--accent)', color: '#fff', fontSize: 10.5, fontWeight: 700, letterSpacing: '.05em',
            textTransform: 'uppercase', whiteSpace: 'nowrap' }}>
            <Icon name="edit" size={11} sw={2.4} />Editing
          </span>
        )}
      </div>

      {/* Filters */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 9, flexWrap: 'wrap', flexShrink: 0 }}>
        {projects.length > 1 && <Select value={proj} options={projects} onChange={v => { setProj(v); resetFilters(); }} style={{ maxWidth: 230 }} />}
        <SearchBox value={q} onChange={setQ} placeholder="Activity, owner, WBS…" width={224} />
        {phases.length > 1 && (
          <Select value={phase} options={['All'].concat(phases)} onChange={setPhase} style={{ maxWidth: 200 }} />
        )}
        {statuses.length > 1 && (statuses.length <= 4
          ? <Segmented value={status} options={['All'].concat(statuses)} onChange={setStatus} />
          : <Select value={status} options={['All'].concat(statuses)} onChange={setStatus} style={{ maxWidth: 170 }} />)}
        {stats.gates > 0 && <ToggleChip on={gatesOnly} onChange={setGatesOnly}>◆ Gates only</ToggleChip>}
        {(count > 0 || serverEdits > 0) && <ToggleChip on={editedOnly} onChange={setEditedOnly}>✎ Edited only</ToggleChip>}
        <div style={{ marginLeft: 'auto' }}>
          <ResultCount shown={rows.length} total={projRows.length} noun="rows" onReset={resetFilters} />
        </div>
      </div>

      <div style={{ flex: 1, minHeight: 0, borderRadius: 15, transition: 'box-shadow .16s cubic-bezier(.22,1,.36,1)',
        boxShadow: editMode ? '0 0 0 2px var(--accent-border)' : 'none' }}>
        <EditableGrid pinLeft={1} fit rows={rows} pending={pending} onEdit={onEdit}
          columns={columns.map(c => (c.editable && !editMode ? Object.assign({}, c, { editable: false }) : c))}
          empty="No rows match the filters" />
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', flexShrink: 0 }}>
        {editMode ? (
          <>
            <Btn variant="primary" icon="save" onClick={apply} disabled={!count || !!busy}>
              {count ? 'Save ' + count + ' change' + (count > 1 ? 's' : '') : 'No changes yet'}
            </Btn>
            <Btn onClick={cancelEditing} disabled={!!busy}>{count ? 'Cancel' : 'Done'}</Btn>
          </>
        ) : (
          <Btn variant="primary" icon="edit" onClick={() => setEditMode(true)} disabled={!!busy}>Edit data</Btn>
        )}
        {serverEdits > 0 && <Btn icon="undo" onClick={resetAll} disabled={!!busy}>Restore uploaded data</Btn>}
        {busy && (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 12, color: 'var(--text-2)', fontWeight: 500 }}>
            <span style={{ width: 13, height: 13, border: '2px solid var(--accent)', borderTopColor: 'transparent',
              borderRadius: '50%', animation: 'spin .6s linear infinite' }} />{busy}
          </span>
        )}
        {!busy && !count && (
          <span style={{ fontSize: 11.5, color: 'var(--text-3)' }}>
            {editMode
              ? 'Click any cell marked ✎ to change it, then save. Saving recomputes risk, health, milestones and budget across the dashboard.'
              : (serverEdits > 0
                ? serverEdits + ' saved change' + (serverEdits > 1 ? 's are' : ' is') + ' feeding every page.'
                : 'Read-only. Choose Edit data to change any cell.')}
          </span>
        )}
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          {phases.slice(0, 7).map(p => (
            <span key={p} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 10.5, color: 'var(--text-3)', fontWeight: 500 }}>
              <span style={{ width: 8, height: 3, borderRadius: 2, background: phaseHex[p] }} />{p}
            </span>
          ))}
        </div>
      </div>
      {err && <Banner tone="neg">{err}</Banner>}
    </div>
  );
}

/* ------------------------------------------------------------------ *
 *  Shell — sidebar + header                                           *
 * ------------------------------------------------------------------ */
const PAGES = [
  { id: 'portfolio', title: 'Portfolio', icon: 'portfolio', comp: PortfolioPage, sub: 'Programme health and delivery risk' },
  { id: 'risks', title: 'Risks', icon: 'risk', comp: RisksPage, sub: 'Register ranked by exposure' },
  { id: 'golive', title: 'Go-Live', icon: 'golive', comp: GoLivePage, sub: 'Planned against forecast dates' },
  { id: 'resources', title: 'Resources', icon: 'resources', comp: ResourcesPage, sub: 'Delivery load by team and owner' },
  { id: 'milestones', title: 'Milestones', icon: 'milestones', comp: MilestonesPage, sub: 'Gates and critical-path tracking' },
  { id: 'ai', title: 'AI Insights', icon: 'ai', comp: AIPage, sub: 'Explainable governance narrative' },
  { id: 'budget', title: 'Budget', icon: 'budget', comp: BudgetPage, sub: 'Cost, forecast and budget risk' },
  { id: 'reports', title: 'Reports', icon: 'reports', comp: ReportsPage, sub: 'Normalised data and exports' },
  { id: 'data', title: 'Data', icon: 'data', comp: DataPage, sub: 'Project plan sources and ingestion' },
  { id: 'plan', title: 'Plan Data', icon: 'edit', comp: PlanDataPage, sub: 'Every row of the ingested plan, editable' },
];

function Sidebar({ active, onNavigate, collapsed, onToggle, hasData = true }) {
  return (
    <aside style={{ width: collapsed ? 60 : 210, flexShrink: 0, background: 'var(--sidebar-bg)',
      borderRight: '1px solid var(--border)', display: 'flex', flexDirection: 'column', transition: 'width .18s cubic-bezier(.22,1,.36,1)' }}>
      <div style={{ padding: collapsed ? '14px 0' : '14px 16px', display: 'flex', alignItems: 'center', gap: 9,
        justifyContent: collapsed ? 'center' : 'flex-start', minHeight: 66, borderBottom: '1px solid var(--border)' }}>
        <div style={{ width: 26, height: 26, borderRadius: 7, background: 'var(--accent)', color: '#fff', display: 'grid',
          placeItems: 'center', fontSize: 13, fontWeight: 700, flexShrink: 0 }}>G</div>
        {!collapsed && (
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, letterSpacing: '-0.01em', lineHeight: 1.2 }}>Governance</div>
            <div style={{ fontSize: 10, color: 'var(--text-3)', fontWeight: 500 }}>Executive console</div>
          </div>
        )}
      </div>
      <nav style={{ flex: 1, padding: '10px 8px', display: 'flex', flexDirection: 'column', gap: 2, overflowY: 'auto' }}>
        {PAGES.map(p => {
          const on = active === p.id;
          const off = !hasData && p.id !== 'data';
          return (
            <button key={p.id} onClick={off ? undefined : () => onNavigate(p.id)} disabled={off}
              title={off ? 'Load a project plan first' : (collapsed ? p.title : undefined)}
              aria-current={on ? 'page' : undefined}
              onMouseEnter={e => { if (!on && !off) e.currentTarget.style.background = 'var(--hover)'; }}
              onMouseLeave={e => { if (!on) e.currentTarget.style.background = 'transparent'; }}
              style={{ display: 'flex', alignItems: 'center', gap: 10, padding: collapsed ? '9px 0' : '9px 11px',
                justifyContent: collapsed ? 'center' : 'flex-start', borderRadius: 8, border: 'none',
                cursor: off ? 'default' : 'pointer', opacity: off ? 0.4 : 1,
                background: on ? 'var(--accent-surface)' : 'transparent', color: on ? 'var(--accent)' : 'var(--text-2)',
                fontSize: 12.5, fontWeight: on ? 600 : 500, textAlign: 'left', whiteSpace: 'nowrap', transition: 'background .12s, color .12s' }}>
              <Icon name={p.icon} size={16} sw={2} />
              {!collapsed && p.title}
            </button>
          );
        })}
      </nav>
      {!collapsed && (D.validation || []).length > 0 && (
        <div style={{ padding: '10px 12px', borderTop: '1px solid var(--border)' }}>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '.05em', textTransform: 'uppercase', color: 'var(--text-3)', marginBottom: 7 }}>Data source</div>
          {(D.validation || []).map((v, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 5 }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%', flexShrink: 0,
                background: v.failed ? 'var(--neg)' : (v.ok ? 'var(--pos)' : 'var(--warn)') }} />
              <span title={v.name} style={{ fontSize: 11, color: 'var(--text-2)', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{v.name}</span>
            </div>
          ))}
          <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-3)', marginTop: 6 }}>
            {(D.validation || []).reduce((a, v) => a + (v.tasks || 0), 0)} tasks normalised
          </div>
        </div>
      )}
      <div style={{ padding: 8, borderTop: '1px solid var(--border)' }}>
        <button onClick={onToggle} aria-label={collapsed ? 'Expand sidebar' : 'Collapse sidebar'}
          onMouseEnter={e => { e.currentTarget.style.background = 'var(--hover)'; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}
          style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '8px 0',
            borderRadius: 8, border: 'none', background: 'transparent', color: 'var(--text-3)', cursor: 'pointer', fontSize: 12, fontWeight: 600 }}>
          <Icon name={collapsed ? 'chevronRight' : 'chevronLeft'} size={15} />
          {!collapsed && 'Collapse'}
        </button>
      </div>
    </aside>
  );
}

function App() {
  const [page, setPage] = useState(() => {
    try { const v = sessionStorage.getItem('gov_page'); if (v && PAGES.some(p => p.id === v)) return v; } catch (e) {}
    return 'portfolio';
  });
  useEffect(() => { try { sessionStorage.setItem('gov_page', page); } catch (e) {} }, [page]);
  const [collapsed, setCollapsed] = useState(() => typeof window !== 'undefined' && window.innerWidth < 980);
  useEffect(() => {
    const sync = () => setCollapsed(window.innerWidth < 980);
    sync(); requestAnimationFrame(sync);
    let prev = window.innerWidth >= 980;
    const onResize = () => { const now = window.innerWidth >= 980; if (now !== prev) { setCollapsed(!now); prev = now; } };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // With no plan loaded the console still opens — it just lands on Data so the
  // first action is obvious, and the other pages stay disabled until there is
  // something to show.
  const hasData = !!D.hasData;
  const effective = hasData ? page : 'data';
  const reg = PAGES.find(p => p.id === effective) || PAGES[0];
  const PageComp = reg.comp;
  const s = D.summary || {};

  return (
    <>
      <Sidebar active={effective} onNavigate={setPage} collapsed={collapsed}
        onToggle={() => setCollapsed(c => !c)} hasData={hasData} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>
        <header style={{ padding: '10px 22px', display: 'flex', alignItems: 'center', gap: 16,
          borderBottom: '1px solid var(--border)', flexShrink: 0, background: 'var(--surface)', minHeight: 66 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: '-0.015em', lineHeight: 1.2 }}>Executive Governance Dashboard</div>
            <div style={{ fontSize: 11.5, color: 'var(--accent)', fontWeight: 600, marginTop: 2 }}>
              {reg.title} · {reg.sub}
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
            {hasData && <>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text-3)' }}>{s.project_count} programmes</span>
              <Pill text={'Health ' + s.portfolio_health} color={RAG_HEX[s.portfolio_health] || '#6B7280'} />
            </>}
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '5px 10px', borderRadius: 8,
              background: 'var(--surface-2)', border: '1px solid var(--border)', fontSize: 10.5, fontWeight: 600, color: 'var(--text-2)' }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--warn)' }} />Simulation
            </span>
          </div>
        </header>
        <main style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', minWidth: 0 }}>
          <div key={page} style={{ flex: 1, minHeight: 0, overflow: 'auto', animation: 'fadeIn .18s cubic-bezier(.22,1,.36,1)' }}>
            <PageComp />
          </div>
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
